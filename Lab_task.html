<!DOCTYPE html>
<html>
<head>
    <title>Text Analyzer</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px;
            background-color: #f4f6f8;
        }

        textarea {
            width: 70%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        button {
            margin-top: 10px;
            padding: 10px 20px;
            background-color: blue;
            color: white;
            border: none;
            border-radius: 5px;
        }

        #output {
            margin-top: 20px;
            font-size: 15px;
        }
    </style>
</head>

<body>

<h2>Text Analyzer</h2>

<form onsubmit="return analyzeText()">
    
    <textarea id="text" rows="6" placeholder="Enter text"></textarea><br>
    
    <button type="submit">Analyze</button>

</form>

<div id="output"></div>

<script>

function analyzeText()
{
    var text = document.getElementById("text").value;

    if(text.trim() === "")
    {
        alert("Fill the box");
        return false;
    }

    var charCount = text.length;
    var wordCount = text.trim().split(/\s+/).length;
    var reversed = text.split("").reverse().join("");

    document.getElementById("output").innerHTML =
        "Characters: " + charCount + "<br>" +
        "Words: " + wordCount + "<br>" +
        "Reversed: " + reversed;

    return false;
}

</script>

</body>
</html>

<!DOCTYPE html>
<html>

    <body>
        <h1>Online Admission</h1>
    <form>
        <fieldset>
<legend>
    <h4>Personal Information</h4>
</legend>
        
        <table>
        <tr>
            <td>Name:</td>
            <td><input type="text"required></td>
        </tr>

        <tr>
            <td>General information:</td>
            <td><input type="text"required></td>

        </tr>

        <tr>
            <td>Email:</td>
            <td><input type="email"required></td>
        </tr>
        <tr><td>Date:</td>
        <td><input type="date"required></td><br>
    </tr>


        <tr>
            <td>Gender:</td>
            <table>
            <td><input type="radio"name="Gender"required>Male</td>
            <td><input type="radio"name="Gender"required>Female</td>
            <td><input type="radio"name="Gender"required>Others</td>
            </table> 
        </tr>
        <tr>
            <td>Interests:</td><br>
            <td><input type="checkbox"name="Selection"max length="10">Photography</td><br>
             <td><input type="checkbox"name="Selection"max length="20">Videography</td><br>
            <td><input type="checkbox"name="Selection"max length="7">Paintaining</td><br>
             <td><input type="checkbox"name="Selection"max length="5">Others</td><br>

        </tr>
        </fieldset>
        <fieldset>
        <legend>
        <h4>Academic Background</h4>
        </legend>
        
        <table>
            <tr>
                <td>JSC:</td>
            <td><input type="text"required></td>
            </tr>

            <tr>
                <td>SSC:</td>
            <td><input type="text"required></td>
            </tr>
            <tr>
                <td>HSC:</td>
            <td><input type="text"required></td>
            </tr>
            <tr>
            <td>Upload Documents:</td>
            <td><input type="file"required></td>
        </tr>
            </table>
        </fieldset>
            
<fieldset>
    <legend>
    <h4>Preferred Department</h4>
</legend>
        
            <td>List of choice:</td>
            <select>
                <option value="Cse"required>Cse</option>
                <option value="EEE"required>EEE</option>
                <option value="IPE"required>IPE</option>
                </fieldset>

            </select>
        </tr>
        
          <tr>
    <td> <input type="submit"> </td>
        </tr> 
        
         <tr>

         </tr>

        </table>
        
    </form>

    </body>
    
</html>
